name: Test Vue example

on:
  push:
    paths:
      - 'examples/vue/spa/**'
      - 'packages/eslint/**'
      - 'packages/oxlint/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-vue-example.yml'
  pull_request:
    paths:
      - 'examples/vue/spa/**'
      - 'packages/eslint/**'
      - 'packages/oxlint/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-vue-example.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build plugins and Vue application
        run: pnpm --filter @open-feod/example-vue-spa... build
      - name: Lint with ESLint
        run: pnpm --filter @open-feod/example-vue-spa lint
      - name: Lint with Oxlint
        run: pnpm --filter @open-feod/example-vue-spa lint:oxlint
      - name: Verify module boundaries
        run: pnpm --filter @open-feod/example-vue-spa test:architecture
      - name: Run module unit tests
        run: pnpm --filter @open-feod/example-vue-spa test:unit --run
      - name: Install Chromium
        run: pnpm --filter @open-feod/example-vue-spa exec playwright install --with-deps chromium
      - name: Verify catalog and cart
        run: pnpm --filter @open-feod/example-vue-spa test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vue-example-playwright-results
          path: |
            examples/vue/spa/playwright-report/
            examples/vue/spa/test-results/
          retention-days: 7
